name: ecommerce-infra
runtime: python
description: E-commerce infrastructure on AWS with Instana monitoring

config:
  aws:region:
    description: AWS region to deploy to
    value: ap-southeast-1
  instana:agentKey:
    description: Instana agent key (secret)
    secret: true
    value: PassWord12345
  instana:endpoint:
    description: Instana endpoint URL
    value: https://saas-ap-southeast-1.instana.io
  db:password:
    description: Aurora database master password
    secret: true
    value: PassWord12345
