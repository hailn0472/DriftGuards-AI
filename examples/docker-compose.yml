      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - PULUMI_CONFIG_PASSPHRASE=
      - PULUMI_SKIP_UPDATE_CHECK=true
    volumes:
      - pulumi-lambda-state:/pulumi-project/.pulumi
    stdin_open: true
    tty: true
    networks:
      - driftguards-network
    profiles:
      - lambda
      - all

