services:
  # EC2 Deployment Service
  pulumi-ec2:
    build:
      context: .
      dockerfile: ./pulumi-ec2-deployment/Dockerfile
    image: pulumi-ec2:latest
    container_name: driftguards-pulumi-ec2
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - PULUMI_CONFIG_PASSPHRASE=
      - PULUMI_SKIP_UPDATE_CHECK=true
    volumes:
      - pulumi-ec2-state:/pulumi-project/.pulumi
    stdin_open: true
    tty: true
    networks:
      - driftguards-network
    profiles:
      - ec2
      - all

  # Lambda Deployment Service
  pulumi-lambda:
    build:
      context: .
      dockerfile: ./pulumi-lambda-deployment/Dockerfile
